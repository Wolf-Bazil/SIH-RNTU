# Disk cache for upstream map tiles. Tiles are immutable for a given z/y/x, so
# a long cache costs nothing and spares the upstream service.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m
                 max_size=512m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basemap tiles, served same-origin.
    #
    # Requesting server.arcgisonline.com directly from the browser works, but
    # is a third-party request: browser tracking protection and corporate
    # filters block it (ERR_BLOCKED_BY_CLIENT), leaving a blank map. Proxying
    # keeps every request first-party and lets us cache the tiles.
    location /tiles/ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/;
        proxy_ssl_server_name on;
        proxy_set_header Host server.arcgisonline.com;
        # Do not forward the visitor's identity to the tile provider.
        proxy_set_header User-Agent "ORCA/1.0";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";

        # Esri sends its own Cache-Control; drop it so ours is not duplicated.
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Expires;

        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Tile-Cache $upstream_cache_status;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Server-Sent Events: buffering must stay off or alerts arrive in batches
    # (or never), and the read timeout must outlive an idle stream.
    location /api/alerts/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
