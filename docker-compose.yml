# Local development stack.
# Ports bind to 127.0.0.1 only so nothing is exposed off this machine.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # Mounted at /srv/backend so the `backend` package stays importable.
    volumes:
      - ./backend:/srv/backend
    command: >
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
