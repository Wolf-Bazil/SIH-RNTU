# Host nginx site for orca.eteon.net -> ORCA web container on 127.0.0.1:8100.
#
# Installed as /etc/nginx/sites-available/orca and symlinked into
# sites-enabled. It is a standalone server block: the eteon site file is never
# read or modified. conf.d/cloudflare-realip.conf already applies globally, so
# $remote_addr is the true client IP here as well.
#
# This is the pre-TLS form. `certbot --nginx -d orca.eteon.net` rewrites this
# file in place, adding the 443 listener and an 80 -> 443 redirect, exactly as
# it did for the eteon site.

server {
    listen 80;
    listen [::]:80;
    server_name orca.eteon.net;

    client_max_body_size 10m;

    # Server-Sent Events. Buffering must stay off or /api/alerts/stream is
    # delivered in chunks instead of live, and the read timeout has to outlive
    # an idle stream. ORCA emits an alert every 4s, comfortably inside
    # Cloudflare's ~100s proxy idle limit.
    location /api/alerts/stream {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
